<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Túlélő – végtelen táj</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9ec3e6;font-family:system-ui,sans-serif}
  canvas{display:block}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
      background:rgba(10,20,30,.55);color:#fff;text-align:center;cursor:pointer;line-height:1.7}
  #ov small{opacity:.8}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;
         background:#fff;mix-blend-mode:difference;pointer-events:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="cross"></div>
<div id="inv" style="position:fixed;left:14px;bottom:12px;color:#fff;font:600 15px system-ui;text-shadow:0 1px 3px #000;pointer-events:none">Piros bogyó: 0 · Kék bogyó: 0 · Fenyő rönk: 0 · Tölgy rönk: 0</div>
<div id="toasts" style="position:fixed;right:14px;top:38%;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none"></div>
<div id="ov"><b id="msg">Betöltés…</b><small>WASD mozgás · Shift futás · Szóköz ugrás · Bal egér: fa kidöntése · Jobb egér: bogyó / rönk felvétele</small></div>
<script type="module" src="game.js"></script>
<script>
  const show = t => { const m = document.getElementById('msg'); if (m) m.textContent = t; };
  addEventListener('error', e => show('Hiba: ' + (e.message || ('nem tölthető be: ' + (e.target && (e.target.src || e.target.href))))), true);
  addEventListener('unhandledrejection', e => show('Hiba: ' + ((e.reason && e.reason.message) || e.reason)));
  setTimeout(() => {
    const m = document.getElementById('msg');
    if (!window.__started && m && m.textContent.startsWith('Betöltés…'))
      show('A játék kódja nem indult el – nyisd meg helyi szerverről (nem file://), és nézd az F12 konzolt.');
  }, 4000);
  show('Betöltés… (' + location.protocol + ')');
</script>
</body>
</html>
